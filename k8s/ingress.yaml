apiVersion: v1
kind: Service
metadata:
  name: workhub-service
  namespace: workhub-prod
spec:
  selector:
    app: workhub
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workhub-ingress
  namespace: workhub-prod
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.workhub.com
    secretName: workhub-tls
  rules:
  - host: api.workhub.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: workhub-service
            port:
              number: 80
